# 폐쇄망 n8n RAG 챗봇 - 전체 서비스 구성
#
#   브라우저 → frontend(Nginx :8080) ─/api/→ n8n(:5678) → qdrant / ollama
#                                              └→ postgres (n8n 영속 DB)
#
# 모든 이미지 태그는 .env 에서 고정한다. 폐쇄망에서는 scripts/prepare-offline 으로
# 저장한 .tar 를 install 스크립트가 docker load 하므로 pull 이 발생하지 않는다.

name: offline-rag

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: offline-rag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 를 .env 에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    <<: *restart
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.19.1}
    container_name: offline-rag-qdrant
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    # 개발 편의를 위해 localhost 에만 노출한다. 최종 환경은 내부 통신만 사용.
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    networks: [rag-net]
    healthcheck:
      # qdrant 이미지에는 curl/wget 이 없으므로 bash /dev/tcp 로 확인한다.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    <<: *restart
    image: ollama/ollama:${OLLAMA_VERSION:-0.35.0}
    container_name: offline-rag-ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # 기본 4096 토큰이면 검색 청크+로그+프롬프트가 잘릴 수 있다 (초과분은 오류 없이 앞부분이 버려짐)
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      # 모델 파일(blobs/manifests)만 호스트 폴더에 저장한다. (Ollama 개인키 등은 컨테이너 안에 둔다)
      # 온라인 PC에서 pull 한 이 폴더를 그대로 복사하면 폐쇄망에서도 모델이 준비된다.
      - ./offline-assets/model-files:/root/.ollama/models
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    networks: [rag-net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    # NVIDIA GPU 가 있으면 아래 주석을 해제한다 (Docker Desktop + WSL2 GPU 지원 필요).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  n8n:
    <<: *restart
    image: n8nio/n8n:${N8N_VERSION:-2.41.3}
    container_name: offline-rag-n8n
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # --- 기본 ---
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY 를 .env 에 설정하세요}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${TZ:-Asia/Seoul}
      TZ: ${TZ:-Asia/Seoul}
      # --- PostgreSQL 영속 저장 ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- 폐쇄망: 외부 호출 차단 ---
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      EXTERNAL_FRONTEND_HOOKS_URLS: ""
      N8N_DIAGNOSTICS_CONFIG_FRONTEND: ""
      N8N_DIAGNOSTICS_CONFIG_BACKEND: ""
      # --- 워크플로우에서 사용하는 값 ($env.XXX) ---
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /data/knowledge-base
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-knowledge_base}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b}
      KNOWLEDGE_BASE_DIR: /data/knowledge-base
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      # --- 브라우저(프론트) 직접 호출 시 CORS. Nginx 프록시 경유 시에는 불필요 ---
      N8N_CORS_ALLOWED_ORIGINS: ${N8N_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5500}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./knowledge-base:/data/knowledge-base:ro
      - ./workflows:/data/workflows:ro
    ports:
      - "${N8N_PORT:-5678}:5678"
    networks: [rag-net]
    healthcheck:
      # /healthz 는 기동 직후에도 ok 를 반환하므로, Workflow·Webhook 준비까지 확인하는 readiness 를 사용한다.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    <<: *restart
    build:
      context: ./frontend
    image: offline-rag-frontend:${FRONTEND_VERSION:-local}
    container_name: offline-rag-frontend
    depends_on:
      n8n:
        condition: service_healthy
    volumes:
      # 개발 중에는 HTML/CSS/JS 수정이 새로고침만으로 반영되도록 마운트한다.
      - ./frontend/public:/usr/share/nginx/html:ro
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  rag-net:
    name: offline-rag-net

volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
